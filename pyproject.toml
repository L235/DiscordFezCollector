[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501", # long lines: log/reply strings; line-length caps new code via formatter
]

[tool.ruff.lint.per-file-ignores]
# Side-effect imports: importing the submodules registers the bot commands.
"src/commands/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
